[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repoqa"
version = "0.1.0"
description = "Codebase Q&A: AST-aware chunks, hybrid retrieval, call-graph expansion, cited answers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ravada Siddharth" }]
dependencies = [
  "tree-sitter>=0.23",
  "tree-sitter-language-pack>=0.6",
  "fastembed>=0.5",
  "numpy>=1.26",
  "pathspec>=0.12",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "typer>=0.12",
  "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
repoqa = "repoqa.cli:main"

[tool.setuptools]
packages = ["repoqa"]
